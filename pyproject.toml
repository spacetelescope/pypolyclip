[project]
name = 'pypolyclip'
description = 'A python driver to the polyclip functions'
readme = 'README.md'
license = 'BSD-3-Clause'
license-files = ['LICENSE.rst']
authors = [
    {name = 'Pypolyclip Developers'},
]
keywords = [
    'computational geometry',
    'polygon clipping',
    'polygon intersection',
    'CUBISM',
    'polyclip',
]
classifiers = [
    'Intended Audience :: Science/Research',
    'Natural Language :: English',
    'Operating System :: OS Independent',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Topic :: Scientific/Engineering :: Astronomy',
]
dynamic = ['version']
requires-python = '>=3.12'
dependencies = ['numpy>=2.0']

[project.urls]
Homepage = 'https://github.com/spacetelescope/pypolyclip'

[project.optional-dependencies]
test = [
    'pytest>=9.0',
    'pytest-cov>=7.0',
]
plot = [
    'matplotlib>=3.10',
]
dev = [
    'pypolyclip[plot,test]',
    'pre-commit>=4.0',
    'tox>=4.24',
]

[build-system]
requires = [
    'extension-helpers>=1.4,<2',
    'numpy>=2.0',
    'setuptools>=77.0.1',
    'setuptools_scm>=8.2',
]
build-backend = 'setuptools.build_meta'

[tool.extension-helpers]
use_extension_helpers = true

[tool.setuptools_scm]
version_file = 'pypolyclip/version.py'

[tool.setuptools]
zip-safe = false
include-package-data = false

[tool.setuptools.packages.find]
namespaces = false

[tool.pytest]
minversion = "9.0"
testpaths = [
    'pypolyclip',
]
addopts = [
    '-ra',
    '--color=yes',
    '--strict-config',
    '--strict-markers',
]
log_level = 'INFO'
xfail_strict = true
filterwarnings = [
    'error',  # turn warnings into exceptions
]

[tool.coverage.run]
omit = [
    'pypolyclip/__init__*',
    'pypolyclip/**/conftest.py',
    'pypolyclip/**/setup*',
    'pypolyclip/**/tests/*',
    'pypolyclip/version*',
    '*/pypolyclip/__init__*',
    '*/pypolyclip/**/conftest.py',
    '*/pypolyclip/**/setup*',
    '*/pypolyclip/**/tests/*',
    '*/pypolyclip/version*',
]

[tool.coverage.report]
exclude_lines = [
    'pragma: no cover',
    'raise NotImplementedError',
    'def main\\(.*\\):',
]

[tool.isort]
skip_glob = [
    'pypolyclip/*__init__.py*',
]
known_first_party = [
    'pypolyclip',
]
use_parentheses = true

[tool.black]
# Exclude every file so that black never reformats the code if an
# editor or another tool runs it. This project does not use black.
force-exclude = """
(
  .*
)
"""

[tool.bandit.assert_used]
skips = ['*_test.py', '*/test_*.py']

[tool.cibuildwheel]
# Explicitly skip free-threaded builds. Free-threaded Python does not
# support the limited API that the environment below selects.
skip = ["cp*t-*"]
environment = { EXTENSION_HELPERS_PY_LIMITED_API = "cp312" }

[tool.repo-review]
ignore = [
    'MY',  # ignore MyPy
    'PC110',  # ignore using black or ruff-format in pre-commit
    'PC111',  # ignore using blacken-docs in pre-commit
    'PC140',  # ignore using mypy in pre-commit
    'PC180',  # ignore using prettier in pre-commit
    'PC901',  # ignore using custom pre-commit update message
    'PC902',  # ignore custom pre-commit CI autofix message
    'PP006',  # ignore missing dependency-groups in pyproject.toml
    'PY005',  # ignore having a tests/ folder
    'RTD100', # ignore having a .readthedocs.yaml file
]

[tool.numpydoc_validation]
checks = [
    'all',   # report on all checks, except the below
    'ES01',  # missing extended summary
    'EX01',  # missing "Examples"
    'RT01',  # do not require return type for lazy properties
    'RT02',  # only type in "Returns" section (no name)
    'SA01',  # missing "See Also"
    'SA04',  # missing "See Also" description
    'SS06',  # single-line summary
]

# Do not report on objects that match any of these regex.
# Remember to use single quotes for regex in TOML.
exclude = [
    '__init__',
    'setup',
    '\._.*',  # private functions/methods
    '^test_*',  # test code
]

[tool.docformatter]
    wrap-summaries = 72
    pre-summary-newline = true
    make-summary-multi-line = true

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ['ALL']
ignore = [
    'ANN',  # type annotations
    'D205',  # missing-blank-line-after-summary
    'PLR0913',  # too-many-arguments
    'PLR0917',  # too-many-positional-arguments
    'PLR2004',  # magic-value-comparison
    'PT028',  # pytest-parameter-with-default-argument
    'PTH',  # Pathlib usage
]

[tool.ruff.lint.flake8-copyright]
min-file-size = 1  # skip empty files (< 1 byte), e.g., __init__.py
notice-rgx = 'Licensed under a 3-clause BSD style license - see LICENSE.rst'

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'

[tool.ruff.lint.per-file-ignores]
'__init__.py' = [
    'D104',  # undocumented-public-package
    'I',  # isort
]
'test_*.py' = [
    'D',  # pydocstyle
    'S101',  # assert
]

[tool.ruff.lint.pydocstyle]
convention = 'numpy'

[tool.ruff.lint.pylint]
max-statements = 130
